<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистический Тренажер: 20 Задач</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #9d50bb;
            --bg: #0b0e14;
            --glass: rgba(255, 255, 255, 0.07);
            --success: #00ff88;
            --error: #ff3366;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top right, #1e1e2f, var(--bg));
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 35px;
            border-radius: 24px;
            width: 95%;
            max-width: 650px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
        }

        .hidden { display: none !important; }

        h1 { font-size: 2rem; text-align: center; margin-bottom: 1rem; background: linear-gradient(45deg, var(--primary), #00ff88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        input {
            width: 100%; padding: 16px; border-radius: 12px; border: 2px solid #333;
            background: rgba(0,0,0,0.4); color: white; font-size: 1rem; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            width: 100%; background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white; border: none; padding: 16px; border-radius: 12px;
            cursor: pointer; font-size: 1.1rem; font-weight: 700; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .opt-btn {
            width: 100%; padding: 14px 20px; margin: 8px 0; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white;
            text-align: left; cursor: pointer; transition: 0.2s; font-size: 1rem;
        }
        .opt-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: scale(1.01); }

        .progress-container { margin-bottom: 20px; }
        .bar-bg { height: 6px; background: #222; border-radius: 10px; }
        .bar-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 10px; transition: 0.4s; }

        #review-scroll { max-height: 400px; overflow-y: auto; margin: 20px 0; padding-right: 10px; }
        .review-box { padding: 15px; border-radius: 12px; margin-bottom: 10px; background: rgba(0,0,0,0.2); border-left: 4px solid var(--error); }
        .review-box.correct { border-left-color: var(--success); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="scr-start" class="card animate__animated animate__fadeIn">
        <h1>🏆 STATS CHAMPION</h1>
        <p style="text-align:center; opacity:0.7">Марафон из 20 задач на логику и статистику</p>
        <input type="text" id="nameInput" placeholder="Введите ваш никнейм">
        <button class="btn" onclick="initGame()">НАЧАТЬ МАРАФОН</button>
    </div>

    <div id="scr-game" class="card hidden">
        <div class="progress-container">
            <div style="display:flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px;">
                <span id="q-num-text">Вопрос 1/20</span>
                <span id="score-live">Счет: 0</span>
            </div>
            <div class="bar-bg"><div id="bar-fill" class="bar-fill"></div></div>
        </div>
        <h2 id="q-text" style="font-size: 1.3rem; margin-bottom: 25px;"></h2>
        <div id="options"></div>
    </div>

    <div id="scr-end" class="card hidden">
        <h1 id="final-title">Готово!</h1>
        <div id="review-scroll"></div>
        <button class="btn" onclick="location.reload()">ПОПРОБОВАТЬ СНОВА</button>
    </div>

    <script>
        // БАЗА ДАННЫХ 50 ВОПРОСОВ
        const bank = [
            { q: "Размах — это разность между...", a: ["Средним и Минимумом", "Максимумом и Минимумом", "Медианой и Квартилем"], c: 1 },
            { q: "Дисперсия — это отклонение от среднего в...", a: ["Квадрате", "Кубе", "Процентах"], c: 0 },
            { q: "Стандартное отклонение измеряется в...", a: ["Единицах данных", "Квадратных единицах", "Безразмерно"], c: 0 },
            { q: "IQR (межквартильный размах) отсекает...", a: ["Только 10% краев", "По 25% с каждого края", "По 50% с каждого края"], c: 1 },
            { q: "Если все числа в ряду увеличить на 10, как изменится размах?", a: ["Увеличится на 10", "Не изменится", "Станет в 10 раз больше"], c: 1 },
            { q: "Вероятность случайного события всегда...", a: ["От -1 до 1", "От 0 до 1", "Больше 1"], c: 1 },
            { q: "Чему равно 3! ?", a: ["3", "6", "9"], c: 1 },
            { q: "Нижний квартиль (Q1) — это точка...", a: ["25% данных", "50% данных", "75% данных"], c: 0 },
            { q: "Медиана ряда 4, 1, 9 (сначала упорядочить!):", a: ["4", "1", "9"], c: 0 },
            { q: "Событие 'Завтра солнце взойдет' для физики это:", a: ["Случайное", "Невозможное", "Достоверное"], c: 2 },
            { q: "Если вероятность P(A) = 0.2, вероятность P(не A) равна:", a: ["0.2", "0.8", "0.5"], c: 1 },
            { q: "Корень из дисперсии это:", a: ["Размах", "IQR", "Стандартное отклонение"], c: 2 },
            { q: "Сколько способов выбрать 1 книгу из 5?", a: ["1", "5", "120"], c: 1 },
            { q: "События совместны, если они:", a: ["Исключают друг друга", "Могут произойти вместе", "Никогда не происходят"], c: 1 },
            { q: "Что точнее описывает разброс без учета выбросов?", a: ["Размах", "IQR", "Среднее"], c: 1 },
            { q: "Чему равна вероятность выпада 7 на кубике?", a: ["0", "1/6", "1"], c: 0 },
            { q: "Факториал 0! равен:", a: ["0", "1", "Ошибка"], c: 1 },
            { q: "В мешке 2 черных и 3 белых шара. Вероятность белого:", a: ["0.4", "0.6", "0.5"], c: 1 },
            { q: "Среднее арифметическое 0, 10, 20:", a: ["10", "15", "30"], c: 0 },
            { q: "Какое событие невозможно при броске монеты?", a: ["Орел", "Решка", "Ребро (в идеальной задаче)", "6 очков"], c: 3 },
            { q: "Верхний квартиль (Q3) — это...", a: ["25% данных", "50% данных", "75% данных"], c: 2 },
            { q: "Чему равно 5! ?", a: ["25", "120", "60"], c: 1 },
            { q: "Размещения используются, когда порядок...", a: ["Важен", "Не важен", "Запрещен"], c: 0 },
            { q: "Сочетания используются, когда порядок...", a: ["Важен", "Не важен", "Произволен"], c: 1 },
            { q: "Если станд. отклонение 3, дисперсия равна:", a: ["9", "1.5", "6"], c: 0 },
            { q: "Если дисперсия 25, станд. отклонение равно:", a: ["625", "5", "12.5"], c: 1 },
            { q: "Размах чисел -5, 0, 5 равен:", a: ["0", "5", "10"], c: 2 },
            { q: "IQR — это разница между:", a: ["Max и Min", "Q3 и Q1", "Средним и Медианой"], c: 1 },
            { q: "Мода — это...", a: ["Среднее", "Самое частое значение", "Значение в центре"], c: 1 },
            { q: "Если в наборе 1, 1, 2, 3, мода это:", a: ["1", "2", "3"], c: 0 },
            { q: "Вероятность выпадения четного числа на кубике:", a: ["1/6", "1/2", "1/3"], c: 1 },
            { q: "Сколько граней у игральной кости?", a: ["4", "6", "10"], c: 1 },
            { q: "P(A) = 1 означает, что событие:", a: ["Редкое", "Достоверное", "Невозможное"], c: 1 },
            { q: "Если данных 10, 10, 10, дисперсия равна:", a: ["10", "0", "1"], c: 1 },
            { q: "Межквартильный размах — это...", a: ["Средние 25%", "Средние 50%", "Средние 75%"], c: 1 },
            { q: "В ящике с усами медиана это...", a: ["Ус", "Линия внутри ящика", "Край ящика"], c: 1 },
            { q: "Сумма вероятностей противоположных событий:", a: ["0", "0.5", "1"], c: 2 },
            { q: "Что больше: 4! или 20?", a: ["4! (24)", "20", "Равны"], c: 0 },
            { q: "Какое число не может быть вероятностью?", a: ["0", "0.7", "1.1"], c: 2 },
            { q: "Среднее ряда 5, 5, 5, 5:", a: ["0", "5", "20"], c: 1 },
            { q: "Как называется 'ящик с усами' в статистике?", a: ["Boxplot", "Histogram", "Scatterplot"], c: 0 },
            { q: "Что показывает хвост (ус) в boxplot?", a: ["Среднее", "Разброс до максимума/минимума", "Ошибку"], c: 1 },
            { q: "Вероятность того, что 2+2=4:", a: ["0", "1", "0.5"], c: 1 },
            { q: "Сколько исходов при броске 1 монеты?", a: ["1", "2", "4"], c: 1 },
            { q: "Если бросить кубик 2 раза, сколько всего исходов?", a: ["12", "36", "6"], c: 1 },
            { q: "Как называется наука о сборе данных?", a: ["Математика", "Статистика", "Геометрия"], c: 1 },
            { q: "Выброс — это значение...", a: ["В центре", "Сильно выбивающееся", "Равное нулю"], c: 1 },
            { q: "Нижний квартиль отсекает...", a: ["Верхние 25%", "Нижние 25%", "Средние 25%"], c: 1 },
            { q: "Если вероятность 0, событие:", a: ["Случайное", "Невозможное", "Редкое"], c: 1 },
            { q: "Статистический размах ряда 1, 2, 3, 10:", a: ["9", "10", "3"], c: 0 }
        ];

        let questions = [];
        let cur = 0;
        let score = 0;
        let history = [];

        function initGame() {
            const n = document.getElementById('nameInput').value;
            if(!n) return alert("Введите имя!");
            questions = bank.sort(() => 0.5 - Math.random()).slice(0, 20);
            document.getElementById('scr-start').classList.add('hidden');
            document.getElementById('scr-game').classList.remove('hidden');
            renderQ();
        }

        function renderQ() {
            const q = questions[cur];
            document.getElementById('q-num-text').innerText = `Вопрос ${cur + 1} / 20`;
            document.getElementById('score-live').innerText = `Счет: ${score}`;
            document.getElementById('q-text').innerText = q.q;
            
            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            
            q.a.forEach((t, i) => {
                const b = document.createElement('button');
                b.className = 'opt-btn animate__animated animate__fadeInUp';
                b.style.animationDelay = (i * 0.1) + 's';
                b.innerText = t;
                b.onclick = () => handle(i);
                optDiv.appendChild(b);
            });
            document.getElementById('bar-fill').style.width = (cur / 20 * 100) + '%';
        }

        function handle(idx) {
            const q = questions[cur];
            const isOk = (idx === q.c);
            if(isOk) score++;
            history.push({q: q.q, ua: q.a[idx], ca: q.a[q.c], ok: isOk});
            
            cur++;
            if(cur < 20) renderQ(); else showResult();
        }

        function showResult() {
            document.getElementById('scr-game').classList.add('hidden');
            const end = document.getElementById('scr-end');
            end.classList.remove('hidden');
            
            const nick = document.getElementById('nameInput').value;
            document.getElementById('final-title').innerText = `${nick}, твой счет: ${score}/20`;
            
            const scroll = document.getElementById('review-scroll');
            scroll.innerHTML = '';
            history.forEach(h => {
                const d = document.createElement('div');
                d.className = `review-box ${h.ok ? 'correct' : ''}`;
                d.innerHTML = `<strong>${h.q}</strong><br>
                ${h.ok ? `✅ Верно: ${h.ca}` : `❌ Твой ответ: ${h.ua}<br>✔️ Правильно: ${h.ca}`}`;
                scroll.appendChild(d);
            });
        }
    </script>
</body>
</html>
