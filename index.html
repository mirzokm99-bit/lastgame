<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic English: The 50-Question Challenge</title>
    <style>
        :root {
            --primary: #1e40af;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 95%;
            max-width: 700px;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.98); }

        .option-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: #fff;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            text-align: left;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f1f5f9; }
        .correct { background: var(--success) !important; color: white; border-color: var(--success) !important; }
        .wrong { background: var(--danger) !important; color: white; border-color: var(--danger) !important; }

        #explanation-area {
            margin-top: 20px;
            padding: 15px;
            background: #f0f9ff;
            border-left: 4px solid var(--primary);
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .progress-container { height: 8px; background: #e2e8f0; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        #progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s; }

        .review-scroll { max-height: 400px; overflow-y: auto; margin-top: 20px; text-align: left; }
        .review-box { padding: 15px; border-bottom: 1px solid #e2e8f0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="start-screen" class="container">
    <h1>Word Mastery Challenge</h1>
    <p>50 Question Pool | 20 Random Rounds | Explanation Mode</p>
    <input type="text" id="user-name" placeholder="Enter your full name" autocomplete="off">
    <button class="btn" onclick="initGame()">Start Assessment</button>
</div>

<div id="game-screen" class="container hidden">
    <div class="progress-container"><div id="progress-fill"></div></div>
    <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem;">
        <span id="player-label"></span>
        <span id="score-label">Score: 0</span>
        <span id="timer-label" style="color:var(--danger)">15s</span>
    </div>
    
    <h2 id="q-text" style="margin: 30px 0; font-size: 1.3rem;"></h2>
    <div id="options-grid"></div>
    
    <div id="explanation-area" class="hidden"></div>
    <button id="next-btn" class="btn hidden" style="margin-top: 20px; width: 100%;" onclick="nextQuestion()">Next Question</button>
</div>

<div id="end-screen" class="container hidden">
    <h1>Final Results</h1>
    <h2 id="final-score"></h2>
    <div id="mistake-log" class="review-scroll"></div>
    <button class="btn" style="margin-top: 20px; width: 100%;" onclick="location.reload()">Play Again</button>
</div>

<script>
    // THE 50 QUESTION POOL
    const masterPool = [
        { q: "The experiment resulted ____ a breakthrough.", a: "in", o: ["in", "to", "at", "with"], exp: "'Result' pairs with 'in' for outcomes. 'Result to' is incorrect grammar." },
        { q: "This research is different ____ the previous one.", a: "from", o: ["from", "than", "with", "against"], exp: "'Different from' is the standard academic form. Avoid 'different than' in formal writing." },
        { q: "We need to find ____ why the hardware failed.", a: "out", o: ["out", "up", "off", "on"], exp: "'Find out' is a phrasal verb meaning to discover facts." },
        { q: "The lab equipment was out of ____.", a: "order", o: ["order", "work", "lack", "use"], exp: "'Out of order' means broken. 'Out of work' means unemployed." },
        { q: "I came ____ an interesting article by chance.", a: "across", o: ["across", "into", "over", "by"], exp: "'Come across' means to find something by accident." },
        { q: "In my ____, AI will change economic modeling.", a: "opinion", o: ["opinion", "view", "thought", "idea"], exp: "'In my opinion' is a fixed phrase for personal perspectives." },
        { q: "The scientist decided to ____ the program again.", a: "run", o: ["run", "operate", "invent", "lack"], exp: "In computing and research, we 'run' a program or an experiment." },
        { q: "What is the exact ____ of the metal wire?", a: "length", o: ["length", "long", "longly", "measure"], exp: "We need the noun form 'length'. 'Long' is an adjective." },
        { q: "At ____, the complex project was finished.", a: "last", o: ["last", "end", "future", "chance"], exp: "'At last' expresses relief after a long wait." },
        { q: "The robot has an ____ arm for precision.", a: "artificial", o: ["artificial", "exact", "sudden", "digital"], exp: "'Artificial' means man-made, suitable for robotics." },
        { q: "There is a lack ____ funding for this study.", a: "of", o: ["of", "in", "to", "with"], exp: "The noun 'lack' is almost always followed by the preposition 'of'." },
        { q: "He arrived at the ____ that the data was wrong.", a: "conclusion", o: ["conclusion", "conclude", "concluding", "conclusive"], exp: "We need the noun 'conclusion' after the article 'the'." },
        { q: "The discovery was made by ____.", a: "chance", o: ["chance", "end", "future", "last"], exp: "'By chance' means accidentally or unexpectedly." },
        { q: "We must ____ the laptop to the network.", a: "connect", o: ["connect", "disconnect", "involve", "operate"], exp: "'Connect' is used when joining two technical components." },
        { q: "A large ____ of students applied today.", a: "number", o: ["number", "amount", "type", "lack"], exp: "Use 'number' for countable things like students; 'amount' is for uncountable things." },
        { q: "The software ____ the results instantly.", a: "processes", o: ["processes", "hardware", "screen", "gadget"], exp: "'Process' is the verb for handling data." },
        { q: "The process began ____ a simple test.", a: "with", o: ["with", "to", "from", "at"], exp: "We 'begin with' a specific starting point." },
        { q: "In the ____, the research was successful.", a: "end", o: ["end", "last", "future", "chance"], exp: "'In the end' refers to the final result of a process." },
        { q: "The historian studied a ____ battle.", a: "historic", o: ["historic", "history", "scientist", "identical"], exp: "'Historic' describes an event that is important in history." },
        { q: "Is this model ____ to the old one?", a: "identical", o: ["identical", "unique", "exact", "sudden"], exp: "'Identical' means exactly the same in every detail." },
        { q: "The gadget has a ____ screen.", a: "digital", o: ["digital", "plastic", "automatic", "exact"], exp: "'Digital' refers to electronic technology using binary data." },
        { q: "Can you ____ the height of the tower?", a: "measure", o: ["measure", "estimate", "examine", "invent"], exp: "To 'measure' is to find the exact size or amount using a tool." },
        { q: "It is hard to ____ the final cost.", a: "estimate", o: ["estimate", "research", "conclude", "involve"], exp: "To 'estimate' is to guess a value based on available info." },
        { q: "The chemist works in a ____.", a: "laboratory", o: ["laboratory", "hardware", "software", "screen"], exp: "A 'laboratory' is a room used for scientific research." },
        { q: "The phone screen is ____ from the body.", a: "disconnected", o: ["disconnected", "connected", "involved", "operated"], exp: "'Disconnected' means the link or join has been broken." },
        { q: "The fascinating ____ of the moon kept us busy.", a: "sight", o: ["sight", "fascination", "discovery", "effect"], exp: "'Sight' refers to something seen, especially something impressive." },
        { q: "The scientist ____ a new way to save power.", a: "invented", o: ["invented", "discovered", "estimated", "researched"], exp: "To 'invent' is to create something that did not exist before." },
        { q: "Is there an ____ for why it failed?", a: "explanation", o: ["explanation", "reason", "idea", "number"], exp: "An 'explanation' is a statement that makes something clear." },
        { q: "The laptop is ____ and easy to carry.", a: "portable", o: ["portable", "digital", "automatic", "complicated"], exp: "'Portable' means light and easy to move or carry." },
        { q: "A number ____ researchers joined us.", a: "of", o: ["of", "in", "to", "with"], exp: "'A number of' is a fixed phrase meaning 'some' or 'several'." },
        { q: "This is a unique ____ of ancient tool.", a: "type", o: ["type", "number", "reason", "idea"], exp: "'Type' refers to a group of things with similar features." },
        { q: "The robot has ____ movements.", a: "automatic", o: ["automatic", "artificial", "exact", "sudden"], exp: "'Automatic' means working by itself without human control." },
        { q: "We need to ____ the results carefully.", a: "examine", o: ["examine", "fascinate", "boil", "measure"], exp: "To 'examine' is to look at something very closely to learn about it." },
        { q: "The new software is very ____ to use.", a: "complicated", o: ["complicated", "digital", "automatic", "plastic"], exp: "'Complicated' means having many parts and being difficult to understand." },
        { q: "The process resulted ____ a sudden decrease.", a: "in", o: ["in", "to", "at", "with"], exp: "'Result in' is the standard phrase for consequences." },
        { q: "The gadget has a ____ touch screen.", a: "digital", o: ["digital", "plastic", "automatic", "exact"], exp: "'Digital' is the technical term for this type of screen." },
        { q: "The chemist used a glass ____.", a: "beaker", o: ["beaker", "laboratory", "hardware", "software"], exp: "A 'beaker' is a glass container used in science labs." },
        { q: "The scientist ____ the behavior of ants.", a: "researched", o: ["researched", "invented", "estimated", "concluded"], exp: "To 'research' is to study a subject in detail to find new info." },
        { q: "There is an ____ amount of data here.", a: "exact", o: ["exact", "sudden", "digital", "automatic"], exp: "'Exact' means completely correct in every detail." },
        { q: "The machine stopped due to a ____ failure.", a: "sudden", o: ["sudden", "exact", "digital", "automatic"], exp: "'Sudden' means happening quickly and without warning." },
        { q: "We used ____ components to build it.", a: "plastic", o: ["plastic", "digital", "automatic", "exact"], exp: "'Plastic' refers to the material used for parts." },
        { q: "The software has a high ____ on efficiency.", a: "effect", o: ["effect", "affect", "effort", "effective"], exp: "Use 'effect' as a noun; 'affect' is usually a verb." },
        { q: "It involves a ____ of different steps.", a: "number", o: ["number", "type", "reason", "idea"], exp: "'A number of' indicates multiple steps." },
        { q: "The laptop screen is very ____.", a: "clear", o: ["clear", "exact", "sudden", "automatic"], exp: "'Clear' is a common adjective for high-quality screens." },
        { q: "The process was ____ from start to finish.", a: "automatic", o: ["automatic", "artificial", "exact", "sudden"], exp: "'Automatic' implies it ran without intervention." },
        { q: "The chemist is ____ by the reaction.", a: "fascinated", o: ["fascinated", "boiled", "examined", "measured"], exp: "To be 'fascinated' is to be extremely interested." },
        { q: "Water will ____ at 100 degrees.", a: "boil", o: ["boil", "examine", "fascinate", "measure"], exp: "'Boil' is the scientific term for liquid turning to gas." },
        { q: "The measurement was very ____.", a: "exact", o: ["exact", "sudden", "digital", "automatic"], exp: "Scientific measurements should be 'exact'." },
        { q: "The software is ____ to this computer.", a: "unique", o: ["unique", "identical", "exact", "sudden"], exp: "'Unique' means it is the only one of its kind." },
        { q: "He is a brilliant ____.", a: "scientist", o: ["scientist", "science", "scientific", "historian"], exp: "We need the noun 'scientist' to describe the person." }
    ];

    let currentQuestions = [];
    let currentIdx = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;
    let playerName = "";
    let mistakes = [];

    function initGame() {
        playerName = document.getElementById('user-name').value;
        if (!playerName) return alert("Please enter your name!");
        
        // Randomize and pick 20
        currentQuestions = [...masterPool].sort(() => 0.5 - Math.random()).slice(0, 20);
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('player-label').innerText = `Player: ${playerName}`;
        
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestions[currentIdx];
        document.getElementById('q-text').innerText = q.q;
        document.getElementById('explanation-area').classList.add('hidden');
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('progress-fill').style.width = `${(currentIdx / 20) * 100}%`;
        
        const grid = document.getElementById('options-grid');
        grid.innerHTML = "";
        
        [...q.o].sort(() => 0.5 - Math.random()).forEach(opt => {
            const b = document.createElement('button');
            b.className = "option-btn";
            b.innerText = opt;
            b.onclick = () => check(opt, b);
            grid.appendChild(b);
        });

        timeLeft = 15;
        document.getElementById('timer-label').innerText = `${timeLeft}s`;
        clearInterval(timer);
        timer = setInterval(tick, 1000);
    }

    function tick() {
        timeLeft--;
        document.getElementById('timer-label').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) check(null, null);
    }

    function check(choice, btn) {
        clearInterval(timer);
        const q = currentQuestions[currentIdx];
        const btns = document.querySelectorAll('.option-btn');
        
        btns.forEach(b => {
            b.disabled = true;
            if (b.innerText === q.a) b.classList.add('correct');
        });

        if (choice === q.a) {
            score += 10;
            document.getElementById('score-label').innerText = `Score: ${score}`;
        } else {
            if (btn) btn.classList.add('wrong');
            mistakes.push({ q: q.q, correct: q.a, yours: choice || "Time Out", exp: q.exp });
        }

        const expArea = document.getElementById('explanation-area');
        expArea.innerHTML = `<strong>Logic:</strong> ${q.exp}`;
        expArea.classList.remove('hidden');
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < 20) loadQuestion();
        else showEnd();
    }

    function showEnd() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = `${playerName}, your score is ${score}/200`;
        
        const log = document.getElementById('mistake-log');
        if (mistakes.length === 0) {
            log.innerHTML = "<p>Amazing! You got a perfect score.</p>";
        } else {
            log.innerHTML = "<h3>Review Your Mistakes:</h3>" + mistakes.map(m => `
                <div class="review-box">
                    <p><strong>Question:</strong> ${m.q}</p>
                    <p>Your Answer: <span style="color:red; text-decoration:line-through">${m.yours}</span> | 
                       Correct: <span style="color:green; font-weight:bold">${m.correct}</span></p>
                    <p style="font-size:0.9rem; color:#666"><em>${m.exp}</em></p>
                </div>
            `).join('');
        }
    }
</script>
</body>
</html>
