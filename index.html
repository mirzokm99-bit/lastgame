<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Passive Ops: Elite Protocol 2.0</title>
    <style>
        :root { --neon: #00ffcc; --warn: #ffcc00; --error: #ff4444; --bg: #0a0a0c; --card: #16161a; }
        body { background: var(--bg); color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; justify-content: center; padding: 20px; }
        #game-box { background: var(--card); border: 2px solid var(--neon); padding: 30px; border-radius: 5px; width: 100%; max-width: 850px; box-shadow: 0 0 20px rgba(0,255,204,0.1); }
        h1 { text-align: center; color: var(--neon); letter-spacing: 4px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .hidden { display: none; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; font-family: inherit; font-size: 0.9rem;}
        .btn:hover { background: var(--neon); color: var(--bg); box-shadow: 0 0 15px var(--neon); }
        input { background: #000; border: 1px solid #444; color: var(--neon); padding: 10px; width: 80%; display: block; margin: 10px auto; text-align: center; }
        .status-bar { display: flex; justify-content: space-between; font-size: 0.8rem; color: #888; margin-bottom: 5px; }
        .prog-container { height: 4px; background: #222; margin-bottom: 20px; }
        #prog-bar { height: 100%; background: var(--neon); width: 0%; transition: 0.3s; }
        .review-item { border-left: 2px solid #444; margin: 10px 0; padding-left: 10px; font-size: 0.8rem; }
        .correct { color: var(--neon); }
        .wrong { color: var(--error); }
    </style>
</head>
<body>

<div id="game-box">
    <div id="p-start">
        <h1>ACCESS_POINT</h1>
        <input type="text" id="id-name" placeholder="[CODENAME]">
        <button class="btn" style="width:100%" onclick="goMenu()">LOGIN</button>
    </div>

    <div id="p-menu" class="hidden">
        <p>GREETINGS, AGENT <span id="agent-display" style="color:var(--neon)"></span></p>
        <div class="menu-grid">
            <button class="btn" onclick="startGame('logic')">LOGIC DECODER<br><small>Tense & Agreement</small></button>
            <button class="btn" onclick="startGame('rebuild')">STRUCTURE RECON<br><small>Sentence Building</small></button>
            <button class="btn" onclick="startGame('audit')">THE AUDIT<br><small>Active vs Passive</small></button>
        </div>
    </div>

    <div id="p-play" class="hidden">
        <div class="status-bar"><span id="mode-name"></span><span id="q-counter">0/20</span></div>
        <div class="prog-container"><div id="prog-bar"></div></div>
        <div id="clue-box" style="margin-bottom:20px">
            <p id="a-sentence" style="color:var(--warn); font-style:italic"></p>
            <p id="task-desc"></p>
        </div>
        <div id="interact-area" style="display:flex; flex-direction:column; gap:10px"></div>
    </div>

    <div id="p-end" class="hidden">
        <h1>SESSION_END</h1>
        <p id="final-stats"></p>
        <button class="btn" style="width:100%" onclick="showReview()">ANALYZE ERRORS</button>
        <button class="btn" style="width:100%; margin-top:10px" onclick="location.reload()">REBOOT</button>
        <div id="review-box" class="hidden"></div>
    </div>
</div>

<script>
// FULL 50 QUESTION BANK - HIGH COMPLEXITY
const bank = [
    {a: "The board is reviewing the data.", p: "The data is being reviewed by the board.", bits: ["The", "data", "is", "being", "reviewed"]},
    {a: "Experts have detected a breach.", p: "A breach has been detected by experts.", bits: ["A", "breach", "has", "been", "detected"]},
    {a: "The CEO signed the merger.", p: "The merger was signed by the CEO.", bits: ["The", "merger", "was", "signed"]},
    {a: "The team is coding the app.", p: "The app is being coded by the team.", bits: ["The", "app", "is", "being", "coded"]},
    {a: "Wind destroyed the farm.", p: "The farm was destroyed by wind.", bits: ["The", "farm", "was", "destroyed"]},
    {a: "NASA will launch the rocket.", p: "The rocket will be launched by NASA.", bits: ["The", "rocket", "will", "be", "launched"]},
    {a: "She found the lost files.", p: "The lost files were found by her.", bits: ["The", "lost", "files", "were", "found"]},
    {a: "He must finish the report.", p: "The report must be finished by him.", bits: ["The", "report", "must", "be", "finished"]},
    {a: "Rain flooded the streets.", p: "The streets were flooded by rain.", bits: ["The", "streets", "were", "flooded"]},
    {a: "They are tracking the signal.", p: "The signal is being tracked by them.", bits: ["The", "signal", "is", "being", "tracked"]},
    {a: "Gravity pulls the moon.", p: "The moon is pulled by gravity.", bits: ["The", "moon", "is", "pulled"]},
    {a: "Fire consumed the building.", p: "The building was consumed by fire.", bits: ["The", "building", "was", "consumed"]},
    {a: "The lab has tested the cure.", p: "The cure has been tested by the lab.", bits: ["The", "cure", "has", "been", "tested"]},
    {a: "We should start the engine.", p: "The engine should be started by us.", bits: ["The", "engine", "should", "be", "started"]},
    {a: "The judge issued a warrant.", p: "A warrant was issued by the judge.", bits: ["A", "warrant", "was", "issued"]},
    {a: "Fans adore the singer.", p: "The singer is adored by fans.", bits: ["The", "singer", "is", "adored"]},
    {a: "The dog bit the man.", p: "The man was bitten by the dog.", bits: ["The", "man", "was", "bitten"]},
    {a: "You must sign the contract.", p: "The contract must be signed by you.", bits: ["The", "contract", "must", "be", "signed"]},
    {a: "Bees produced the honey.", p: "The honey was produced by bees.", bits: ["The", "honey", "was", "produced"]},
    {a: "The chef is cooking fish.", p: "Fish is being cooked by the chef.", bits: ["Fish", "is", "being", "cooked"]},
    {a: "The storm damaged the roof.", p: "The roof was damaged by the storm.", bits: ["The", "roof", "was", "damaged"]},
    {a: "Someone stole the jewels.", p: "The jewels were stolen.", bits: ["The", "jewels", "were", "stolen"]},
    {a: "The guide led the group.", p: "The group was led by the guide.", bits: ["The", "group", "was", "led"]},
    {a: "She had read the book.", p: "The book had been read by her.", bits: ["The", "book", "had", "been", "read"]},
    {a: "The jury reached a verdict.", p: "A verdict was reached by the jury.", bits: ["A", "verdict", "was", "reached"]},
    {a: "The company hired the intern.", p: "The intern was hired by the company.", bits: ["The", "intern", "was", "hired"]},
    {a: "Birds build nests.", p: "Nests are built by birds.", bits: ["Nests", "are", "built"]},
    {a: "He repaired the engine.", p: "The engine was repaired by him.", bits: ["The", "engine", "was", "repaired"]},
    {a: "The police caught the thief.", p: "The thief was caught by the police.", bits: ["The", "thief", "was", "caught"]},
    {a: "I will call the doctor.", p: "The doctor will be called by me.", bits: ["The", "doctor", "will", "be", "called"]},
    {a: "The waiter served the wine.", p: "The wine was served by the waiter.", bits: ["The", "wine", "was", "served"]},
    {a: "She is cleaning the room.", p: "The room is being cleaned by her.", bits: ["The", "room", "is", "being", "cleaned"]},
    {a: "Lightning hit the tower.", p: "The tower was hit by lightning.", bits: ["The", "tower", "was", "hit"]},
    {a: "They have won the game.", p: "The game has been won by them.", bits: ["The", "game", "has", "been", "won"]},
    {a: "The mayor opened the park.", p: "The park was opened by the mayor.", bits: ["The", "park", "was", "opened"]},
    {a: "The sun warms the earth.", p: "The earth is warmed by the sun.", bits: ["The", "earth", "is", "warmed"]},
    {a: "He is recording the song.", p: "The song is being recorded by him.", bits: ["The", "song", "is", "being", "recorded"]},
    {a: "The cat caught the bird.", p: "The bird was caught by the cat.", bits: ["The", "bird", "was", "caught"]},
    {a: "I wrote the letter.", p: "The letter was written by me.", bits: ["The", "letter", "was", "written"]},
    {a: "They sell shoes here.", p: "Shoes are sold here.", bits: ["Shoes", "are", "sold"]},
    {a: "She will buy the house.", p: "The house will be bought by her.", bits: ["The", "house", "will", "be", "bought"]},
    {a: "He has found the map.", p: "The map has been found by him.", bits: ["The", "map", "has", "been", "found"]},
    {a: "We are painting the fence.", p: "The fence is being painted by us.", bits: ["The", "fence", "is", "being", "painted"]},
    {a: "The wind shook the trees.", p: "The trees were shaken by the wind.", bits: ["The", "trees", "were", "shaken"]},
    {a: "The kids ate the pizza.", p: "The pizza was eaten by the kids.", bits: ["The", "pizza", "was", "eaten"]},
    {a: "He had locked the gate.", p: "The gate had been locked by him.", bits: ["The", "gate", "had", "been", "locked"]},
    {a: "She creates beautiful art.", p: "Beautiful art is created by her.", bits: ["Beautiful", "art", "is", "created"]},
    {a: "They will finish the task.", p: "The task will be finished by them.", bits: ["The", "task", "will", "be", "finished"]},
    {a: "The nurse treats the patient.", p: "The patient is treated by the nurse.", bits: ["The", "patient", "is", "treated"]},
    {a: "The mechanic fixed the car.", p: "The car was fixed by the mechanic.", bits: ["The", "car", "was", "fixed"]}
];

let state = { user: "", score: 0, current: 0, mode: "", questions: [], log: [] };

function goMenu() {
    state.user = document.getElementById('id-name').value || "RECRUIT";
    document.getElementById('agent-display').innerText = state.user;
    switchPage('p-start', 'p-menu');
}

function startGame(mode) {
    state.mode = mode; state.current = 0; state.score = 0; state.log = [];
    state.questions = [...bank].sort(() => 0.5 - Math.random()).slice(0, 20);
    switchPage('p-menu', 'p-play');
    render();
}

function render() {
    if(state.current >= state.questions.length) return end();
    const q = state.questions[state.current];
    document.getElementById('q-counter').innerText = `${state.current+1}/20`;
    document.getElementById('prog-bar').style.width = `${(state.current/20)*100}%`;
    const area = document.getElementById('interact-area');
    area.innerHTML = "";

    if(state.mode === 'logic') {
        document.getElementById('a-sentence').innerText = `INPUT: ${q.a}`;
        document.getElementById('task-desc').innerText = "SELECT ACCURATE PASSIVE RECONSTRUCTION:";
        let opts = [q.p, q.p.replace("been", "being"), q.p.replace("was", "is").replace("were", "are")].sort(() => 0.5 - Math.random());
        opts.forEach(opt => {
            let b = document.createElement('button'); b.className = "btn"; b.innerText = opt;
            b.onclick = () => submit(opt === q.p, opt, q.p);
            area.appendChild(b);
        });
    } else if(state.mode === 'rebuild') {
        document.getElementById('a-sentence').innerText = `INPUT: ${q.a}`;
        document.getElementById('task-desc').innerText = "REASSEMBLE PASSIVE DATA:";
        let build = [];
        let p = document.createElement('p'); p.innerText = "_ "; area.appendChild(p);
        [...q.bits].sort(() => 0.5 - Math.random()).forEach(w => {
            let b = document.createElement('button'); b.className = "btn"; b.innerText = w;
            b.onclick = () => {
                build.push(w); p.innerText = build.join(" "); b.style.display = "none";
                if(build.length === q.bits.length) submit(build.join(" ") === q.bits.join(" "), build.join(" "), q.p);
            };
            area.appendChild(b);
        });
    } else if(state.mode === 'audit') {
        let isPass = Math.random() > 0.5;
        let testS = isPass ? q.p : q.a;
        document.getElementById('a-sentence').innerText = `SCANNING: "${testS}"`;
        document.getElementById('task-desc').innerText = "SYSTEM AUDIT: DETECT VOICE PROTOCOL";
        ['ACTIVE VOICE', 'PASSIVE VOICE'].forEach(type => {
            let b = document.createElement('button'); b.className = "btn"; b.innerText = type;
            b.onclick = () => {
                let correct = (isPass && type === 'PASSIVE VOICE') || (!isPass && type === 'ACTIVE VOICE');
                submit(correct, type, isPass ? 'PASSIVE' : 'ACTIVE');
            };
            area.appendChild(b);
        });
    }
}

function submit(correct, got, want) {
    if(correct) state.score++;
    state.log.push({q: state.questions[state.current].a, got, want, ok: correct});
    state.current++; render();
}

function end() {
    switchPage('p-play', 'p-end');
    document.getElementById('final-stats').innerText = `SCORE: ${state.score} / 20 | EFFICIENCY: ${(state.score/20)*100}%`;
}

function showReview() {
    const box = document.getElementById('review-box');
    box.innerHTML = "";
    state.log.forEach(l => {
        box.innerHTML += `<div class="review-item">CASE: ${l.q}<br><span class="${l.ok?'correct':'wrong'}">${l.ok?'✔':'✘'} ${l.got}</span> ${!l.ok ? `[REQ: ${l.want}]` : ''}</div>`;
    });
    box.classList.remove('hidden');
}

function switchPage(oldP, newP) {
    document.getElementById(oldP).classList.add('hidden');
    document.getElementById(newP).classList.remove('hidden');
}
</script>
</body>
</html>
